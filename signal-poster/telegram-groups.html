<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Telegram Groups — FoundryFX</title>
<style>
  :root {
    --bg: #0b0f0a;
    --panel: #10140f;
    --border: #263021;
    --accent: #FF7A1A;
    --success: #9BEE00;
    --blue: #2F6FED;
    --orange: #C2410C;
    --text: #f2f2f2;
    --muted: #8a938a;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
  }
  a { text-decoration: none; }

  .topnav {
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo-mark {
    width: 40px; height: 40px; border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
  }
  .brand-text { display: flex; flex-direction: column; }
  .brand-name { font-weight: 800; font-size: 18px; color: var(--text); }
  .brand-name .fx { color: var(--accent); }
  .brand-tag { font-size: 10px; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; }
  .tabs { display: flex; gap: 28px; flex-wrap: wrap; }
  .tab { color: var(--text); font-size: 14px; font-weight: 600; opacity: 0.75; }
  .tab:hover, .tab.active { opacity: 1; color: var(--accent); }
  .nav-actions { display: flex; flex-direction: column; gap: 8px; }
  .nav-btn {
    display: block;
    text-align: center;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 13px;
  }
  .nav-btn.orange { background: var(--orange); color: #fff; }
  .nav-btn.blue { background: var(--blue); color: #fff; }

  .page { max-width: 700px; margin: 0 auto; padding: 60px 20px 100px; text-align: center; }
  .page h1 { font-size: 26px; margin-bottom: 12px; }
  .page p { color: var(--muted); font-size: 15px; line-height: 1.7; }
  .group-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    margin-top: 32px;
    display: inline-block;
  }
  .group-card img {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    margin-bottom: 18px;
  }
  .group-card h2 { font-size: 18px; margin: 0 0 16px; }
  .group-btn {
    display: inline-block;
    background: var(--blue);
    color: #fff;
    font-weight: 700;
    padding: 12px 28px;
    border-radius: 8px;
    font-size: 14px;
  }
</style>
</head>
<body>

<nav class="topnav">
  <div class="brand">
    <img src="assets/foundryfx-logo.png" alt="FoundryFX logo" class="logo-mark" />
    <div class="brand-text">
      <div class="brand-name">Foundry<span class="fx">FX</span></div>
      <div class="brand-tag">Trade Smarter. Together.</div>
    </div>
  </div>
  <div class="tabs">
    <a href="index.html" class="tab">HOME</a>
    <a href="live-room.html" class="tab">LIVE ROOM</a>
    <a href="brokers.html" class="tab">BROKERS</a>
    <a href="telegram-groups.html" class="tab active">TELEGRAM GROUPS</a>
  </div>
  <div class="nav-actions">
    <a href="post-signal.html" class="nav-btn orange">Post Signal</a>
    <a href="brokers.html" class="nav-btn blue">Get Started</a>
  </div>
</nav>

<div class="page">
  <h1>Telegram Groups</h1>
  <p>
    Join our groups below to get real time signals and analysis.
  </p>

  <div class="group-card">
    <img src="assets/foundryfx-basic-logo.png" alt="FoundryFX Basic group logo" />
    <h2>FoundryFX Basic</h2>
    <a class="group-btn" href="https://t.me/xtradefloor" target="_blank" rel="noopener">
      Join Group →
    </a>
  </div>
</div>

</body>
</html>
