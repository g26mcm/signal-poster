<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>New Signal</title>
<style>
  :root {
    --bg: #0b0f0a;
    --panel: #10140f;
    --border: #263021;
    --border-focus: #9BEE00;
    --accent: #C6FF00;
    --text: #f2f2f2;
    --muted: #8a938a;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 900px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  h1 {
    font-size: 20px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  label {
    display: block;
    font-size: 12px;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  label .req { color: #ff5c5c; }
  .row {
    display: grid;
    gap: 16px;
    margin-bottom: 20px;
  }
  .row.cols-2 { grid-template-columns: 1fr 1fr; }
  .row.cols-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
  .row.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  input, select, textarea {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--border-focus);
  }
  textarea { resize: vertical; min-height: 60px; }
  button.primary {
    background: var(--accent);
    color: #0b0f0a;
    font-weight: 700;
    border: none;
    padding: 16px 24px;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    width: 100%;
  }
  button.primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 10px; }
  .status { margin-top: 16px; font-size: 14px; padding: 12px; border-radius: 8px; display: none; }
  .status.ok { background: #123312; color: #9BEE00; display: block; }
  .status.err { background: #331212; color: #ff8a8a; display: block; }
  .attach {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--accent);
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 24px;
    font-size: 14px;
  }
</style>
</head>
<body>

<h1>⚡ New Signal</h1>

<form id="signalForm">
  <div class="row">
    <div>
      <label>Send to channel</label>
      <select id="channel">
        <option value="trading_floor">FoundryFX Signals</option>
        <option value="foundryfx_floor">FoundryFX Floor</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div>
      <label>Password <span class="req">*</span></label>
      <input id="password" type="password" placeholder="Enter password" required />
    </div>
  </div>

  <div class="row cols-3">
    <div>
      <label>Direction</label>
      <select id="direction">
        <option value="BUY">BUY</option>
        <option value="SELL">SELL</option>
      </select>
    </div>
    <div>
      <label>Pair / Currency</label>
      <select id="pair">
        <option>XAUUSD</option>
        <option>EURUSD</option>
        <option>GBPUSD</option>
        <option>US30</option>
        <option>NAS100</option>
        <option>BTCUSD</option>
      </select>
    </div>
    <div>
      <label>Entry (single or zone) <span class="req">*</span></label>
      <input id="entry" placeholder="e.g. 1234.5 or 1234 - 1236" required />
    </div>
  </div>

  <div class="row cols-4">
    <div><label>TP1 <span class="req">*</span></label><input id="tp1" placeholder="TP1" required /></div>
    <div><label>TP2 (opt)</label><input id="tp2" placeholder="TP2" /></div>
    <div><label>TP3 (opt)</label><input id="tp3" placeholder="TP3" /></div>
    <div><label>TP4 (opt)</label><input id="tp4" placeholder="TP4" /></div>
  </div>

  <div class="row cols-3">
    <div><label>TP5 (opt)</label><input id="tp5" placeholder="TP5" /></div>
    <div><label>TP6 (opt)</label><input id="tp6" placeholder="TP6" /></div>
    <div><label>Stop loss <span class="req">*</span></label><input id="sl" placeholder="SL" required /></div>
  </div>

  <div class="row">
    <div>
      <label>Notes</label>
      <textarea id="notes" placeholder="Notes (optional)"></textarea>
    </div>
  </div>

  <button type="submit" class="primary" id="submitBtn">Post Signal</button>
  <div class="hint">Posting broadcasts immediately — sent to Telegram now.</div>
  <div class="status" id="status"></div>
</form>

<script>
  // Point this at wherever your backend is running
  const API_URL = "https://signal-poster.onrender.com/api/post-signal";

  const form = document.getElementById("signalForm");
  const statusEl = document.getElementById("status");
  const btn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = "Posting...";
    statusEl.className = "status";

    const payload = {
      password: document.getElementById("password").value,
      channel: document.getElementById("channel").value,
      direction: document.getElementById("direction").value,
      pair: document.getElementById("pair").value,
      entry: document.getElementById("entry").value,
      tps: [1,2,3,4,5,6].map(n => document.getElementById("tp"+n).value).filter(Boolean),
      sl: document.getElementById("sl").value,
      notes: document.getElementById("notes").value,
    };

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();

      if (res.ok) {
        statusEl.textContent = "✅ Signal posted to Telegram.";
        statusEl.className = "status ok";
        form.reset();
      } else {
        throw new Error(data.error || "Unknown error");
      }
    } catch (err) {
      statusEl.textContent = "❌ Failed to post: " + err.message;
      statusEl.className = "status err";
    } finally {
      btn.disabled = false;
      btn.textContent = "Post Signal";
    }
  });
</script>

</body>
</html>
